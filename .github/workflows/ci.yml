name: CI / Production Readiness & Audit Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic Build, Typecheck, Test & Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Deterministic Install (npm ci)
        run: npm ci

      - name: Deterministic Pipeline Verification (Clean, Typecheck, Build Packages, Build Web, Test, Manifests, Hashes, Security)
        run: npm run verify

      - name: Ensure Clean Working Tree
        run: git diff --exit-code

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-reports
          path: |
            generated/
            packages/*/dist/
          retention-days: 14
