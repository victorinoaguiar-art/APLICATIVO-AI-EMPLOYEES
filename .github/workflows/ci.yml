name: CI / Production Readiness & Audit Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-checkout-verification:
    name: Clean Checkout Local Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x ]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Deterministic Install (npm ci)
        run: npm ci

      - name: Production Dependency Audit
        run: npm audit --omit=dev

      - name: Local Full Verification
        run: npm run verify

      - name: Ensure Clean Working Tree
        run: |
          CHANGES=$(git status --porcelain)
          if [ -n "$CHANGES" ]; then
            echo "[FATAL] TRACKED_WORKTREE_MUTATION: Unexpected mutations in clean checkout"
            echo "$CHANGES"
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code

  verify:
    name: Deterministic Build, Typecheck, Test & Audit (22.x)
    runs-on: ubuntu-latest
    needs: [ clean-checkout-verification ]
    strategy:
      matrix:
        node-version: [ 22.x ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Deterministic Install (npm ci)
        run: node scripts/record-npm-ci.mjs --output .artifacts/evidence

      - name: Production Dependency Audit
        run: npm audit --omit=dev

      - name: Monorepo Clean
        run: npm run clean

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Build Monorepo Packages
        run: npm run build:packages

      - name: Build Web Application
        run: npm run build:web

      - name: Next.js ESLint
        run: npm run lint

      - name: Automated Test Suites
        run: npm test

      - name: Ajv Manifest & Domain Cardinality Validation
        run: npm run validate:manifests

      - name: Physical Hash Cryptographic Verification
        run: npm run verify:hashes

      - name: Security & Behavioral Controls Verification
        run: npm run verify:security

      - name: Transactional Payment & Webhook Verification
        run: npm run verify:payments

      - name: Multi-Tenant Authentication & Authorization Verification
        run: npm run verify:auth

      - name: Generate CI Forensic Evidence Bundle
        run: node scripts/generate-evidence.mjs --output .artifacts/evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Evidence Coherence & Same-SHA Gate
        run: npm run verify:evidence-artifact -- --dir .artifacts/evidence

      - name: Upload Evidence Artifacts Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetf-evidence-bundle-${{ github.sha }}
          path: .artifacts/evidence/
          retention-days: 30

      - name: Ensure Clean Working Tree
        run: |
          CHANGES=$(git status --porcelain)
          if [ -n "$CHANGES" ]; then
            echo "[FATAL] TRACKED_WORKTREE_MUTATION: Tracked files mutated during CI execution"
            echo "$CHANGES"
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-reports
          path: |
            generated/
            packages/*/dist/
          retention-days: 14
