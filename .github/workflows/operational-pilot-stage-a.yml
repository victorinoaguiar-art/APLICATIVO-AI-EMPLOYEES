name: Operational Pilot - Etapa A (Preparacao e Desafio)

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Modo de Execução (DEMO ou OPERATIONAL_PILOT)'
        required: true
        default: 'DEMO'
        type: choice
        options:
          - 'DEMO'
          - 'OPERATIONAL_PILOT'
      intake_run_id:
        description: 'Run ID do workflow de intake (obrigatório em OPERATIONAL_PILOT)'
        required: false
        default: ''
      input_artifact_id:
        description: 'Artifact ID do pacote validado pelo intake (obrigatório em OPERATIONAL_PILOT)'
        required: false
        default: ''
      input_artifact_name:
        description: 'Nome do artefacto de intake (obrigatório em OPERATIONAL_PILOT)'
        required: false
        default: ''
      input_package_sha256:
        description: 'SHA-256 do pacote externo (obrigatório em OPERATIONAL_PILOT)'
        required: false
        default: ''
      tenant_id:
        description: 'Tenant ID Autorizado'
        required: true
        default: 'DEMO_TENANT_ALFA_001'
      task_id:
        description: 'Identificador da Tarefa Empresarial'
        required: true
        default: 'DEMO_TASK_NOTICE_001'

permissions:
  contents: read
  actions: read

jobs:
  stage-a-prepare-and-challenge:
    name: "Etapa A: Ingestão, Validação e Desafio Aberto"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase at Exact Audited SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Clean Security Audit
        run: npm audit --omit=dev

      - name: Compile Monorepo Packages
        run: npm run build:packages

      - name: Run Operational Pilot Test Suite (22 Mandatory Tests)
        run: node --test packages/runtime/dist/test/operationalPilotReal.test.js

      - name: Verify Repository Security Gate (No Fallback Secrets)
        run: node scripts/verify-security.mjs

      - name: Verify Environment Protection Rules (Fail-Closed Check)
        run: |
          node scripts/verify-environment-protection.mjs \
            --mode="${{ github.event.inputs.execution_mode || 'DEMO' }}" \
            --environment=protected-pilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Prepare Ingested Input (External Package or Controlled Demo)
        run: |
          if [ "${{ github.event.inputs.execution_mode }}" = "OPERATIONAL_PILOT" ]; then
            node scripts/prepare-operational-pilot-input.mjs \
              --intake-run-id="${{ github.event.inputs.intake_run_id }}" \
              --input-artifact-id="${{ github.event.inputs.input_artifact_id }}" \
              --input-artifact-name="${{ github.event.inputs.input_artifact_name }}" \
              --input-package-sha256="${{ github.event.inputs.input_package_sha256 }}" \
              --out-dir=.artifacts/pilot \
              --tenant-id="${{ github.event.inputs.tenant_id }}" \
              --task-id="${{ github.event.inputs.task_id }}" \
              --mode=OPERATIONAL_PILOT
          else
            node scripts/prepare-demo-pilot-input.mjs \
              --out-dir=.artifacts/pilot \
              --tenant-id="${{ github.event.inputs.tenant_id }}" \
              --task-id="${{ github.event.inputs.task_id }}"
          fi
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Execute Stage A (Prepare Task and Issue Review Challenge)
        run: |
          node scripts/run-operational-pilot.mjs \
            --stage=prepare-and-challenge \
            --mode="${{ github.event.inputs.execution_mode || 'DEMO' }}" \
            --input=.artifacts/pilot/operational-pilot-input.json \
            --db=.artifacts/pilot/pilot.db \
            --output-dir=.artifacts/pilot/evidence \
            --tenant-id="${{ github.event.inputs.tenant_id }}" \
            --task-id="${{ github.event.inputs.task_id }}"
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload Stage A Artifact Bundle
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: aetf-pilot-stage-a-${{ github.sha }}
          path: .artifacts/pilot
          retention-days: 90
