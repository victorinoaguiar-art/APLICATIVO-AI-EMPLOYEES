name: Evidence Remote Verification

on:
  workflow_run:
    workflows:
      - "CI / Production Readiness & Audit Gate"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  verify-remote-evidence:
    name: Remote Evidence Verification Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Evidence Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: aetf-evidence-bundle-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Enrich Remote CI Receipt
        run: node scripts/sync-remote-ci-receipt.mjs ${{ github.event.workflow_run.id }} ${{ github.event.workflow_run.head_sha }} .artifacts/evidence
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Evidence Remote Verification Gate
        run: npm run verify:evidence-remote -- --dir .artifacts/evidence --sha ${{ github.event.workflow_run.head_sha }}
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          ENFORCE_REMOTE_CI: 'true'

      - name: Upload Verified Remote Receipt
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: aetf-remote-verification-receipt-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/evidence/github-actions-receipt.json
          if-no-files-found: error
