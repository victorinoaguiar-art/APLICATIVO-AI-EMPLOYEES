name: Evidence Remote Verification

on:
  workflow_run:
    workflows:
      - "CI / Production Readiness & Audit Gate"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  verify-remote-evidence:
    name: Remote Evidence Verification Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Evidence Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: aetf-evidence-bundle-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync and Enrich Remote CI Receipt
        run: |
          node scripts/sync-remote-ci-receipt.mjs \
            "${{ github.event.workflow_run.id }}" \
            "${{ github.event.workflow_run.head_sha }}" \
            .artifacts/evidence \
            "${{ github.run_id }}" \
            "${{ github.run_attempt }}" \
            "${{ github.actor }}"
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          EXPECTED_QUERY_ACTOR: ${{ github.actor }}
          REMOTE_VERIFICATION_RUN_ID: ${{ github.run_id }}
          PRIMARY_RUN_ID: ${{ github.event.workflow_run.id }}

      - name: Run Evidence Remote Verification Gate
        run: |
          npm run verify:evidence-remote -- \
            --dir .artifacts/evidence \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --classification PATCH_VERIFIED_AND_CI_ENFORCED_WITH_ADMIN_BYPASS \
            --report AETF500_Relatorio_Correccao_Final_Evidencias_CI.md \
            --expected-query-actor "${{ github.actor }}" \
            --remote-run-id "${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          EXPECTED_QUERY_ACTOR: ${{ github.actor }}
          REMOTE_VERIFICATION_RUN_ID: ${{ github.run_id }}
          ENFORCE_REMOTE_CI: 'true'

      - name: Validate Final Verified Evidence Bundle Consistency
        run: |
          node scripts/verify-evidence-bundle.mjs \
            --dir .artifacts/evidence \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --report AETF500_Relatorio_Correccao_Final_Evidencias_CI.md \
            --classification PATCH_VERIFIED_AND_CI_ENFORCED_WITH_ADMIN_BYPASS \
            --expected-query-actor "${{ github.actor }}" \
            --remote-run-id "${{ github.run_id }}"
        env:
          EXPECTED_QUERY_ACTOR: ${{ github.actor }}
          REMOTE_VERIFICATION_RUN_ID: ${{ github.run_id }}

      - name: Upload Verified Remote Evidence Bundle
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: aetf-verified-remote-evidence-bundle-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/evidence/
          if-no-files-found: error
          retention-days: 30
