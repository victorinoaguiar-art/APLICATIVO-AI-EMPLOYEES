name: Operational Pilot - Etapa B (Decisao Humana e Fecho)

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: 'Modo de Execução (OPERATIONAL_PILOT ou DEMO)'
        required: true
        default: 'OPERATIONAL_PILOT'
        type: choice
        options:
          - 'OPERATIONAL_PILOT'
          - 'DEMO'
      stage_a_run_id:
        description: 'Run ID da Etapa A no GitHub Actions (numérico)'
        required: true
      stage_a_artifact_id:
        description: 'Artifact ID exacto da Etapa A (numérico)'
        required: true
      stage_a_head_sha:
        description: 'Commit SHA exacto verificado e auditado na Etapa A'
        required: true
      challenge_id:
        description: 'ID do Desafio de Revisão Criptográfico pendente (ex: CHAL_...)'
        required: true
      event_signed_at:
        description: 'Timestamp RFC 3339 correspondente à assinatura da decisão humana'
        required: true
      decision:
        description: 'Decisão Humana Explícita'
        required: true
        type: choice
        options:
          - 'APPROVED'
          - 'REJECTED'
          - 'REQUEST_CHANGES'
      tenant_id:
        description: 'Tenant ID Autorizado'
        required: true
      task_id:
        description: 'Identificador da Tarefa Empresarial'
        required: true
      reviewer_id:
        description: 'ID do Revisor Humano Autorizado'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  stage-b-human-review-closure:
    name: "Etapa B: Decisão Humana, Consumo de Desafio e Fecho"
    runs-on: ubuntu-latest
    environment: protected-pilot

    steps:
      - name: Checkout Codebase at Exact Audited SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Monorepo Packages
        run: npm run build:packages

      - name: Download and Reconcile Stage A Physical Artifacts
        run: |
          node scripts/reconcile-stage-a-artifact.mjs \
            --stage-a-run-id="${{ github.event.inputs.stage_a_run_id }}" \
            --stage-a-artifact-id="${{ github.event.inputs.stage_a_artifact_id }}" \
            --stage-a-head-sha="${{ github.event.inputs.stage_a_head_sha }}" \
            --out-dir=.artifacts/pilot \
            --mode="${{ github.event.inputs.execution_mode }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Execute Stage B (Review and Archival Closure)
        run: |
          node scripts/run-operational-pilot.mjs \
            --stage=review-and-close \
            --mode="${{ github.event.inputs.execution_mode }}" \
            --input=.artifacts/pilot/operational-pilot-input.json \
            --db=.artifacts/pilot/pilot.db \
            --output-dir=.artifacts/pilot/evidence \
            --stage-a-run-id="${{ github.event.inputs.stage_a_run_id }}" \
            --stage-a-artifact-id="${{ github.event.inputs.stage_a_artifact_id }}" \
            --stage-a-head-sha="${{ github.event.inputs.stage_a_head_sha }}" \
            --challenge-id="${{ github.event.inputs.challenge_id }}" \
            --event-signed-at="${{ github.event.inputs.event_signed_at }}" \
            --tenant-id="${{ github.event.inputs.tenant_id }}" \
            --task-id="${{ github.event.inputs.task_id }}" \
            --reviewer-id="${{ github.event.inputs.reviewer_id }}" \
            --decision="${{ github.event.inputs.decision }}"
        env:
          GIT_COMMIT_SHA: ${{ github.event.inputs.stage_a_head_sha }}
          GITHUB_SHA: ${{ github.event.inputs.stage_a_head_sha }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ENV_APPROVAL_ID: ${{ github.run_id }}
          REVIEWER_TOKEN: ${{ secrets.PILOT_REVIEWER_TOKEN }}
          REVIEW_SIGNATURE: ${{ secrets.PILOT_REVIEW_SIGNATURE }}
          REVIEWER_SECRET: ${{ secrets.PILOT_SECRET_REV_MARIA }}

      - name: Verify Operational Pilot Manifest (Bidirectional 7-Plane Forensic Check)
        run: |
          node scripts/verify-operational-pilot-manifest.mjs \
            --dir=.artifacts/pilot/evidence \
            --input=.artifacts/pilot/operational-pilot-input.json \
            --db=.artifacts/pilot/pilot.db
        env:
          GIT_COMMIT_SHA: ${{ github.event.inputs.stage_a_head_sha }}
          GITHUB_SHA: ${{ github.event.inputs.stage_a_head_sha }}

      - name: Package Evidence and Upload Protected Closure Bundle
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: aetf-pilot-closure-${{ github.event.inputs.stage_a_head_sha }}
          path: .artifacts/pilot
          retention-days: 90
