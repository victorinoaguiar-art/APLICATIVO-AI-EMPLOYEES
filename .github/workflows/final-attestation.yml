name: Final Forensic Attestation & Audit Verification

on:
  workflow_run:
    workflows:
      - "Evidence Remote Verification"
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: read

jobs:
  final-forensic-attestation:
    name: Final Forensic Attestation Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Verified Evidence Bundle Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: aetf-verified-remote-evidence-bundle-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Physical Evidence Bundle Hashes
        run: |
          cd .artifacts/evidence
          sha256sum -c evidence-files.sha256

      - name: Resolve Authoritative Remote Run Details & Artifact ID
        id: remote_meta
        run: |
          # Query remote execution API response to get authoritative metadata
          REMOTE_RUN_RAW=$(gh api repos/victorinoaguiar-art/APLICATIVO-AI-EMPLOYEES/actions/runs/${{ github.event.workflow_run.id }})
          echo "$REMOTE_RUN_RAW" > .artifacts/evidence/final-remote-run-api-response.json

          # Fetch artifact ID of aetf-verified-remote-evidence-bundle
          ARTIFACTS_JSON=$(gh api repos/victorinoaguiar-art/APLICATIVO-AI-EMPLOYEES/actions/runs/${{ github.event.workflow_run.id }}/artifacts)
          ARTIFACT_ID=$(echo "$ARTIFACTS_JSON" | jq -r '.artifacts[] | select(.name=="aetf-verified-remote-evidence-bundle-${{ github.event.workflow_run.head_sha }}") | .id')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "::error::Verified remote evidence bundle artifact not found on run ${{ github.event.workflow_run.id }}"
            exit 1
          fi

          # Also get primary run id from github-actions-receipt.json
          PRIMARY_RUN_ID=$(jq -r '.primary_run_id // .run_id' .artifacts/evidence/github-actions-receipt.json)
          if [ -z "$PRIMARY_RUN_ID" ] || [ "$PRIMARY_RUN_ID" = "null" ]; then
            echo "::error::Could not resolve primary_run_id from receipt"
            exit 1
          fi

          # Check primary run conclusion via API
          PRIMARY_RUN_RAW=$(gh api repos/victorinoaguiar-art/APLICATIVO-AI-EMPLOYEES/actions/runs/$PRIMARY_RUN_ID)
          PRIMARY_CONCLUSION=$(echo "$PRIMARY_RUN_RAW" | jq -r '.conclusion')
          if [ "$PRIMARY_CONCLUSION" != "success" ]; then
            echo "::error::Primary CI run conclusion is not success: $PRIMARY_CONCLUSION"
            exit 1
          fi

          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "primary_run_id=$PRIMARY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "primary_conclusion=$PRIMARY_CONCLUSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Final Forensic Attestation
        run: |
          node scripts/generate-final-attestation.mjs \
            --dir .artifacts/evidence \
            --output .artifacts/attestation \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --primary-run-id "${{ steps.remote_meta.outputs.primary_run_id }}" \
            --remote-run-id "${{ github.event.workflow_run.id }}" \
            --primary-conclusion "${{ steps.remote_meta.outputs.primary_conclusion }}" \
            --remote-conclusion "${{ github.event.workflow_run.conclusion }}" \
            --actor "${{ github.actor }}" \
            --artifact-id "${{ steps.remote_meta.outputs.artifact_id }}" \
            --classification PATCH_VERIFIED_AND_CI_ENFORCED_WITH_ADMIN_BYPASS
        env:
          EXPECTED_QUERY_ACTOR: ${{ github.actor }}

      - name: Verify Final Forensic Attestation
        run: |
          node scripts/verify-final-attestation.mjs \
            --attestation .artifacts/attestation/final-attestation.json \
            --evidence-dir .artifacts/evidence \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --primary-run-id "${{ steps.remote_meta.outputs.primary_run_id }}" \
            --remote-run-id "${{ github.event.workflow_run.id }}" \
            --artifact-id "${{ steps.remote_meta.outputs.artifact_id }}" \
            --expected-actor "${{ github.actor }}" \
            --expected-classification PATCH_VERIFIED_AND_CI_ENFORCED_WITH_ADMIN_BYPASS

      - name: Upload Final Forensic Attestation Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: aetf-final-attestation-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/attestation/
          if-no-files-found: error
          retention-days: 30
