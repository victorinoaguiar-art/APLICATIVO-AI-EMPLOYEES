name: Final Forensic Attestation & Audit Verification

on:
  workflow_run:
    workflows:
      - "Evidence Remote Verification"
    types:
      - completed
    branches:
      - master

permissions:
  actions: read
  contents: read

jobs:
  final-forensic-attestation:
    name: Final Forensic Attestation Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Verified Evidence Bundle Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: aetf-verified-remote-evidence-bundle-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Physical Evidence Bundle Hashes
        run: |
          cd .artifacts/evidence
          sha256sum -c evidence-files.sha256

      - name: Preserve Physical Final API Responses & Generate Index
        id: final_responses
        run: |
          mkdir -p .artifacts/final-evidence
          mkdir -p .artifacts/attestation

          # 1. Resolve Primary Run ID from verified receipt
          PRIMARY_RUN_ID=$(jq -r '.primary_run_id // .run_id' .artifacts/evidence/github-actions-receipt.json)
          if [ -z "$PRIMARY_RUN_ID" ] || [ "$PRIMARY_RUN_ID" = "null" ]; then
            echo "::error::Could not resolve primary_run_id from receipt"
            exit 1
          fi

          # 2. Query and preserve final physical response of Primary CI run
          gh api repos/victorinoaguiar-art/APLICATIVO-AI-EMPLOYEES/actions/runs/$PRIMARY_RUN_ID > .artifacts/final-evidence/final-primary-run-api-response.json

          # 3. Query and preserve final physical response of Remote Verification run
          gh api repos/victorinoaguiar-art/APLICATIVO-AI-EMPLOYEES/actions/runs/${{ github.event.workflow_run.id }} > .artifacts/final-evidence/final-remote-run-api-response.json

          # 4. Query and preserve final physical response of Remote Artifacts
          gh api repos/victorinoaguiar-art/APLICATIVO-AI-EMPLOYEES/actions/runs/${{ github.event.workflow_run.id }}/artifacts > .artifacts/final-evidence/final-remote-artifacts-api-response.json

          # 5. Extract authoritative artifact ID
          ARTIFACT_ID=$(jq -r '.artifacts[] | select(.name=="aetf-verified-remote-evidence-bundle-${{ github.event.workflow_run.head_sha }}") | .id' .artifacts/final-evidence/final-remote-artifacts-api-response.json)
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "::error::Verified remote evidence bundle artifact not found in artifacts response"
            exit 1
          fi

          # 6. Generate final evidence files index
          cd .artifacts/final-evidence
          sha256sum final-primary-run-api-response.json final-remote-run-api-response.json final-remote-artifacts-api-response.json > final-evidence-files.sha256
          sha256sum -c final-evidence-files.sha256
          cd ../..

          # 7. Copy preserved responses and index to attestation bundle
          cp .artifacts/final-evidence/* .artifacts/attestation/

          echo "primary_run_id=$PRIMARY_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Final Forensic Attestation
        run: |
          node scripts/generate-final-attestation.mjs \
            --dir .artifacts/evidence \
            --output .artifacts/attestation \
            --primary-run-response .artifacts/final-evidence/final-primary-run-api-response.json \
            --remote-run-response .artifacts/final-evidence/final-remote-run-api-response.json \
            --final-evidence-index .artifacts/final-evidence/final-evidence-files.sha256 \
            --artifacts-response .artifacts/final-evidence/final-remote-artifacts-api-response.json \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --primary-run-id "${{ steps.final_responses.outputs.primary_run_id }}" \
            --remote-run-id "${{ github.event.workflow_run.id }}" \
            --actor "${{ github.actor }}" \
            --artifact-id "${{ steps.final_responses.outputs.artifact_id }}" \
            --classification PATCH_VERIFIED_AND_CI_ENFORCED_WITH_ADMIN_BYPASS
        env:
          EXPECTED_QUERY_ACTOR: ${{ github.actor }}

      - name: Verify Final Forensic Attestation
        run: |
          node scripts/verify-final-attestation.mjs \
            --attestation .artifacts/attestation/final-attestation.json \
            --evidence-dir .artifacts/evidence \
            --primary-run-response .artifacts/final-evidence/final-primary-run-api-response.json \
            --remote-run-response .artifacts/final-evidence/final-remote-run-api-response.json \
            --final-evidence-index .artifacts/final-evidence/final-evidence-files.sha256 \
            --artifacts-response .artifacts/final-evidence/final-remote-artifacts-api-response.json \
            --sha "${{ github.event.workflow_run.head_sha }}" \
            --primary-run-id "${{ steps.final_responses.outputs.primary_run_id }}" \
            --remote-run-id "${{ github.event.workflow_run.id }}" \
            --artifact-id "${{ steps.final_responses.outputs.artifact_id }}" \
            --expected-actor "${{ github.actor }}" \
            --expected-classification PATCH_VERIFIED_AND_CI_ENFORCED_WITH_ADMIN_BYPASS

      - name: Upload Final Forensic Attestation & Physical Evidence Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: aetf-final-attestation-${{ github.event.workflow_run.head_sha }}
          path: .artifacts/attestation/
          if-no-files-found: error
          retention-days: 30
